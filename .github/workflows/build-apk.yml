name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm ci

      - name: Copy app into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TalkToMario.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TalkToMario-apk
          path: TalkToMario.apk

      - name: Publish APK as a release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Talk to Mario v1.0.${{ github.run_number }}
          body: "Download TalkToMario.apk below and open it on your Android phone."
          files: TalkToMario.apk
          make_latest: true
